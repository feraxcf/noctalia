[audio]
enable_overdrive = true

[bar]
order = [ "top" ]

    [bar.top]
    background_opacity = 1
    capsule = true
    capsule_border = "outline"
    capsule_opacity = 0.64999998547136784
    capsule_padding = 8.0
    capsule_thickness = 0.64999998919665813
    center = [ "group:g2" ]
    end = [ "group:g3", "group:g5", "battery", "group:g4" ]
    layer = "top"
    margin_ends = 150
    padding = 8
    radius_top_left = 80
    radius_top_right = 80
    scale = 0.90000000596046448
    start = [ "brightness", "workspaces", "group:g1" ]
    thickness = 32

        [[bar.top.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "outline"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "media", "audio_visualizer" ]
        opacity = 0.64999997615814209
        padding = 8.0

        [[bar.top.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "outline"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "control-center", "clock", "theme_mode" ]
        opacity = 0.64999997615814209
        padding = 8.0
        radius = 6.0
        widget_spacing = 12

        [[bar.top.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "outline"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "network", "bluetooth" ]
        opacity = 0.64999997615814209
        padding = 8.0

        [[bar.top.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "outline"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "notifications", "tray" ]
        opacity = 0.64999997615814209
        padding = 8.0

        [[bar.top.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = "outline"
        enabled = true
        fill = "surface_variant"
        id = "g5"
        members = [ "widget", "input_volume" ]
        opacity = 0.64999997615814209
        padding = 8.0

